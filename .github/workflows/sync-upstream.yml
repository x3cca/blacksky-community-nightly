name: Sync upstream main

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into public main
    if: github.repository == 'x3cca/blacksky-community-nightly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out public main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current upstream main
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: blacksky-algorithms/blacksky.community
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune upstream main
          upstream_sha="$(git rev-parse upstream/main)"

          git config --local credential.helper '!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          trap 'git config --local --unset-all credential.helper >/dev/null 2>&1 || true' EXIT

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            {
              echo "## Public main already current"
              echo
              echo "Upstream commit \`$upstream_sha\` is already contained in \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          merge_status=0
          git merge --no-commit --no-ff "$upstream_sha" || merge_status=$?
          if ! git rev-parse --verify --quiet MERGE_HEAD; then
            echo "error: upstream merge did not start" >&2
            [ "$merge_status" -ne 0 ] || merge_status=1
            exit "$merge_status"
          fi
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "error: upstream merge has conflicts outside .github/workflows" >&2
            git diff --name-only --diff-filter=U >&2
            exit "$merge_status"
          fi
          git commit --no-edit
          git push origin HEAD:refs/heads/main

          {
            echo "## Synced public main"
            echo
            echo "Merged upstream commit \`$upstream_sha\` into \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
